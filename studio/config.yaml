# 魔搭创空间配置 + 展示元数据（电影 Agent v3.5，2026-09-11）
sdk: gradio
app_file: app.py
sdk_version: "6.17.3"  # 与平台实际运行时一致（Gradio 6.x）

# ---- 以下为展示元数据（app.py 读取；也可不写，用内建默认）----
showcase:
  title: AI+∞ 电影 Agent（多 Agent Harness）
  tagline: 一句话 → 五个角色分工（编剧/分镜/导演/质检/剪辑）→ 分镜表 + 可执行生产包；访客自带模型与引擎，空间零模型零凭据
  hero_points:
    - 多 Agent Harness：编剧→分镜→导演→质检→剪辑 五个角色，一条状态机调度，全程可观测
    - 零配置可用：不填任何 key 也有内置规则引擎保底，产出"照做就能拍"的分镜表与生产包
    - 访客自带大脑：填自己的通用大模型 key → 剧本/分镜由真模型产出，Critic 判分择优采用
    - 访客自带引擎：填视频生成模型接口 → 空间内逐段提交→轮询→成片回传（算力与费用都在你这一侧）
    - 可执行生产包：plan.json / jobs.jsonl / commands.md / run_plan.py / accept.md / post.md / film.srt / trace.json
    - 规则轨质检：帧网格、台词时长、提示词合规、一致性锚点、可执行性逐项判分，不达标自动改写重试
    - 空间内**不部署任何模型**、不推理、不下载权重：只做规划、质检与指令生成
  flow_steps:
    - "① 一句话：输入创意（可选风格/时长/阵容/画幅/锚点）→ 点「🎬 生成制片方案」"
    - "② 编剧：产出剧本 JSON（片名/主题/角色形象卡/台词表）；不填 key 时由 108 套分镜模板直出"
    - "③ 分镜：帧网格定时长（5+17k @24fps）、运镜光影情绪、跨镜一致性锚点；随后静态预检闸门把关"
    - "④ 导演 + 质检：逐段产出六段式提示词、参数、请求体与命令行；Critic 规则轨判分并自动改写重试（有界）"
    - "⑤ 交付：下载可执行生产包；若填了引擎则继续逐段提交、轮询、回传成片（MODE 会显示『真出片』）"
  samples:
    - {file: 01_direct_720p.mp4, cover: 01_direct_720p_cover.jpg, title: "720p 直出 · 病房戏", desc: "1280×736/24fps/5.17s；剧情直出+成品链", style: "电影感"}
    - {file: 02_ref2v_720p.mp4, cover: 02_ref2v_720p_cover.jpg, title: "多参考图连贯（r2v）", desc: "3 张参考图（角色/场景）全片锁定；720p", style: "电影感"}
    - {file: 03_talk_nobox.mp4, cover: 03_talk_nobox_cover.jpg, title: "真台词 · 无框终版", desc: "角色真的说出设定台词；整脸重渲染无贴皮框", style: "真实"}
    - {file: 04_keep_orig.mp4, cover: 04_keep_orig_cover.jpg, title: "角色原声保留 · 旁白错开", desc: "台词=角色原声+字幕；旁白独立垫轨（不干扰话语）", style: "纪录片"}
    - {file: 05_comfy_chain.mp4, cover: 05_comfy_chain_cover.jpg, title: "ComfyUI 全链一体化", desc: "生成→48fps 插帧→整脸修复→配音字幕→ASR 全链", style: "真实"}
    - {file: 06_rife_48fps.mp4, cover: 06_rife_48fps_cover.jpg, title: "RIFE 48fps 插帧", desc: "24fps→48fps 高帧率（插帧后画面顺滑）", style: "纪录片"}
    - {file: 07_story_script.mp4, cover: 07_story_script_cover.jpg, title: "剧本→故事片（主控）", desc: "希区柯克《油价涨了》短篇：剧本 JSON→9 段连贯+4 句真台词字幕；断点续跑", style: "电影感"}
    - {file: 08_talk_one.mp4, cover: 08_talk_one_cover.jpg, title: "说话镜头（H3 自适应音色）", desc: "一句台词→按语音时长生成→H3 自己选音色说话（音画同时长）+ ASR 验收 1.000", style: "真实"}
  voices:
    - ["yunxi（中文·男声）", yunxi]
    - ["xiaoxiao（中文·女声）", xiaoxiao]
    - ["aria（英文·女声）", aria]
    - ["daler（英文·男声）", daler]
  styles: [电影感, 真实, 纪录片, 动漫]
  footer: 空间内不部署任何模型、自身零凭据；模型配置面板由访客自填（key 只存会话内存，不落盘、不进日志）。未配置引擎时交付"可执行生产包"（MODE=仅生产计划），配置后即可在空间内直接出片。样片墙 8 部为本机 GPU 全链生成的对照样片，用于展示本项目成片链的质量上限。